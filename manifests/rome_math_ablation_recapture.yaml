schema_version: rome-math-ablation-recapture-v1
scientific_baseline: false
status: pending_recapture
created_before_candidate_selection: true

split_policy:
  type: fixed_family_holdout
  development_families:
    - gpt-j
    - gpt2
    - llama
    - mistral
    - qwen
  held_out_families:
    - deepseek
    - falcon
    - opt
  final_frozen_protocol:
    status: blocked_missing_original_manifests
    reported_result: 38/40
    missing_roots:
      - weighted-bilateral-crossfamily-n5
      - weighted-spectrum-holdout-cases5-9
      - weighted-spectrum-gpt2-xl-holdout-n5
  rule: >-
    Select formula and calibrate B1 on development families only; evaluate the
    frozen choice on held-out families; use the restored 40-case protocol only
    as the final published-result reproduction gate.
  held_out_release_gate:
    status: closed
    opens_after:
      - candidate_math_frozen
      - global_b1_cutoff_frozen
    note: >-
      DeepSeek, Falcon, and OPT must not be captured or inspected before both
      conditions are satisfied.

capture:
  producer: rome-math-ablation
  schema_version: rome-math-ablation-capture-v1
  edit_method: rome
  case_selection:
    mode: contiguous_slice
    start_idx: 0
    count: 100
  smoke:
    run_ids:
      - rome-math-ablation-smoke-a-v1
      - rome-math-ablation-smoke-b-v1
    case_ids:
      - 0
      - 1
    models:
      - gpt2-medium
      - mistral-7b-v0.1
  development:
    run_id: rome-math-ablation-development-v1
    models:
      - gpt-j-6b
      - gpt2-medium
      - gpt2-xl
      - llama2-7b
      - mistral-7b-v0.1
      - qwen3-8b
  expected_capture_paths:
    smoke: analysis_out/rome-math-ablation-smoke-{a,b}-v1/plans/{model}/cases0-1_r01/methods/rome/captures/rome-math-ablation.json
    development: analysis_out/rome-math-ablation-development-v1/plans/{model}/cases0-99_r01/methods/rome/captures/rome-math-ablation.json

local_availability_audit:
  audit_date: 2026-07-28
  model_tensor_files_under_analysis_out: 0
  complete_huggingface_models:
    - sshleifer/tiny-gpt2
  unusable_for_protocol:
    - model: sshleifer/tiny-gpt2
      reason: only two repeated layers, so no eligible local second difference
    - model: gpt2-xl
      reason: cache contains an incomplete weight download only
  conclusion: required recapture checkpoints are missing locally

models:
  - run_id: rome-math-ablation-development-v1
    model: gpt-j-6b
    model_identifier: EleutherAI/gpt-j-6B
    family: gpt-j
    split: development
    checkpoint_availability: missing_locally
  - run_id: rome-math-ablation-development-v1
    model: gpt2-medium
    model_identifier: gpt2-medium
    family: gpt2
    split: development
    checkpoint_availability: missing_locally
  - run_id: rome-math-ablation-development-v1
    model: gpt2-xl
    model_identifier: gpt2-xl
    family: gpt2
    split: development
    checkpoint_availability: incomplete_local_cache
  - run_id: rome-math-ablation-development-v1
    model: llama2-7b
    model_identifier: NousResearch/Llama-2-7b-hf
    family: llama
    split: development
    checkpoint_availability: missing_locally
  - run_id: rome-math-ablation-development-v1
    model: mistral-7b-v0.1
    model_identifier: mistralai/Mistral-7B-v0.1
    family: mistral
    split: development
    checkpoint_availability: missing_locally
  - run_id: rome-math-ablation-development-v1
    model: qwen3-8b
    model_identifier: Qwen/Qwen3-8B
    family: qwen
    split: development
    checkpoint_availability: missing_locally
  - run_id: null
    model: deepseek-7b-base
    model_identifier: deepseek-ai/deepseek-llm-7b-base
    family: deepseek
    split: held_out_family
    checkpoint_availability: missing_locally
  - run_id: null
    model: falcon-7b
    model_identifier: tiiuae/falcon-7b
    family: falcon
    split: held_out_family
    checkpoint_availability: missing_locally
  - run_id: null
    model: opt-6.7b
    model_identifier: facebook/opt-6.7b
    family: opt
    split: held_out_family
    checkpoint_availability: missing_locally

binary_validation:
  status: not_scheduled
  blockers:
    - no independent clean-checkpoint corpus
    - no non-ROME low-rank hard negatives
    - no other editor, fine-tune, quantized, merged, pruning, or conversion corpus
  permitted_claims_before_resolution:
    B0: ROME-compatible low-rank edit only
    B1: unvalidated ROME suspicion only
    B2: experimental control only
