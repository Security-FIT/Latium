[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "unit: no GPU/model downloads",
  "integration: CPU torch allowed, no model downloads",
  "gpu: requires CUDA/model weights",
  "slow: long-running benchmark tests",
]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.ruff.format]
quote-style = "preserve"
