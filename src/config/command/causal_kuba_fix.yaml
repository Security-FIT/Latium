defaults:
  - causal_kuba
  - _self_

name: causal-kuba-fix

legacy_trace:
  output_dir: analysis_out/causal_kuba_fix
  num_valid_facts: 100
  max_dataset_examples_to_scan: 10000
  # One draw preserves legacy's single-noise experiment. Increase explicitly
  # for repeated paired draws; it does not introduce windows or a selector.
  num_noise_samples: 1
  # Absolute embedding-noise std. Null uses model.corruption_noise_multiplier,
  # falling back to 3 * embedding-weight std only when the model has no scale.
  noise_std: null
  require_correct_clean_prediction: true
  seed: 42
  # Optional frozen CounterFact selection, used by the fine-tuned fleet.
  case_index_file: null
  case_start: 0
