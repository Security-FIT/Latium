defaults:
  - /model_base@_global_.model: default
  - /model@_global_.model: gpt-j-6b
  - /generation@_global_.generation: generation
  - /dataset_facts@_global_.dataset_facts: counterfact
  - /dataset_sm@_global_.dataset_sm: wikitext
  - _self_

name: causal-trace

causal_trace:
  output_dir: analysis_out/causal_trace
  num_valid_facts: 100
  max_dataset_examples_to_scan: 10000
  num_noise_samples: 10
  noise_batch_size: 10
  # One reproducible Gaussian corruption scale per model, in embedding standard deviations.
  noise_multiplier: 3.0
  # Width one measures the layer later passed to ROME. Wider windows are exploratory.
  window_size: 1
  require_correct_clean_prediction: true
  bootstrap_samples: 1000
  confidence_level: 0.95
  overwrite_model_config_layer: false
  seed: 42
