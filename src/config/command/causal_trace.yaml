defaults:
  - /model_base@_global_.model: default
  - /model@_global_.model: gpt-j-6b
  - /generation@_global_.generation: generation
  - /dataset_facts@_global_.dataset_facts: counterfact
  - /dataset_sm@_global_.dataset_sm: wikitext
  - _self_

name: causal-trace

causal_trace:
  output_dir: analysis_out/causal_trace
  num_valid_facts: 100
  max_dataset_examples_to_scan: 10000
  num_noise_samples: 10
  noise_batch_size: 10
  # Per fact, find the weakest corruption that passes the existing effect guard.
  # Set a positive number to reproduce a fixed-scale experiment exactly.
  noise_multiplier: auto
  window_size: 10
  require_correct_clean_prediction: true
  min_total_effect: 0.03
  max_corrupt_relative_std: 1.0
  discovery_fraction: 0.5
  minimum_confirmation_facts: 50
  bootstrap_samples: 1000
  confidence_level: 0.95
  trim_fraction: 0.10
  neighbor_support_radius: 2
  local_support_fraction: 0.90
  adjacent_peak_radius: 2
  noninferiority_margin_fraction: 0.10
  minimum_supported_centers: 3
  allow_near_supported_region: true
  overwrite_model_config_layer: false
  seed: 42
