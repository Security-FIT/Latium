identifier: rome_t4
description: "Memory-aware ROME with exact micro-batched k/v steps."
factory: src.editing.rome_t4.method:RomeT4EditMethod

# Opt-in notebook preset; merged over the protected base model by build_rome_config.
# Keep these settings local to this edit method, never in model_base/default.
presets:
  qwen3.5-4b-t4:
    base_model: qwen3.5-4b
    model_overrides:
      rome_prompt_mode: chat
      rome_system_prompt: "You are a helpful assistant. Answer briefly in the same language as the user."
      dtype: bf16
      second_moment_path: ./data/stats/Qwen_Qwen3.5-4B_5_SM_Method.WIKIPEDIA_100000.pt
      second_moment_dir: ./data/stats
      epochs: 15
      v_N: 20
      k_N: 20
      prefix_range: [2, 6]
      prefix_mode: static
      prefix_enforce_latin: true
      prefix_min_words: 2
      v_batch_size: 4
      k_batch_size: 8
      k_early_exit: true
      second_moment_device: cpu
      second_moment_cache: true
      insert_kv_in_place: true
      optimize_v_clear_cache_every: 0
      optimize_v_log_memory: true
