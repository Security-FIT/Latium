run_root: null
artifact: null
output_dir: null
renderer_preset: paper
style_preset: default
enable_renderers: []
disable_renderers: []
renderers:
  structural-artifact-grid:
    features:
      - spectral_gap
      - top1_energy
      - row_alignment
      - norm_cv
      - effective_rank
    transforms:
      - raw
      - lz5
      - lz7
      - curv
    formats:
      - png
      - pdf
      - json
  rome-detector-explainer:
    formats:
      - png
      - pdf
      - json
      - csv
    max_cases: null
    profile_fields:
      - operator_norm
      - frobenius_norm
      - rank1_energy
      - rank2_energy
      - neighbor_cka_distance
      - directional_background
      - relative_operator_norm
      - signed_relative_shift
      - relative_subspace_operator_norm
      - relative_subspace_frobenius
      - relative_subspace_rank1_energy
      - bilateral_coherence
      - bilateral_alignment
      - bilateral_frobenius
      - bilateral_balance
force: false
