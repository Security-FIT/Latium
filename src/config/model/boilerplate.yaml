# Common defaults such as device, cache dirs, ROME optimizer defaults, and
# prefix generation defaults live in ../model_base/default.yaml.
name: "MODEL_NAME"

# Use print-arch to determine the layer name templates for your model.
# The {} placeholder is replaced by the layer number during intervention.
layer_name_template: "transformer.h.{}.mlp.fc_out"
fc_layer_name_template: "transformer.h.{}.mlp.fc_in"
restore_layer_name_template: "transformer.h.{}"
corrupt_layer_name_template: "transformer.wte"
layer: LAYER_NUMBER
corruption_noise_multiplier: MULTIPLIER_VALUE

# Model-specific overrides only; omit fields that match model_base/default.yaml.
dtype: "bf16"
second_moment_path: "./data/second_moment_stats/MODEL_NAME_LAYER_SM_Method.WIKIPEDIA_100000.pt"
