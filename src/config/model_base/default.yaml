models_dir: "../models"
save_new_weights: false
new_weights_dir: "./data/new_weights"
second_moment_dir: "./data/second_moment_stats"
second_moment_path: null
second_moment_batch_size_mode: "auto"
second_moment_batch_size: null
second_moment_target_samples: null
second_moment_max_length: null
second_moment_min_text_length: 50
second_moment_clear_cache_every: 0
device: "cuda"
dtype: "auto"
save_to_local: true

# ROME optimization defaults.
lr: 0.5
kl_factor: 0.0625
weight_decay: 0.5
epochs: 20
k_N: 50
v_N: 50
prefix_range: [2, 10]
epsilon: 0.0
optimize_pcs: false
optimize_v_clear_cache_every: 0

# Memory / batching knobs.
# Prompt splitting and in-place insertion are opt-in. Key early exit and
# covariance caching are enabled; numerical/prompt bug fixes live in ROME itself.
v_batch_size: 0          # prompts per forward in optimize_v (0 = all at once)
k_batch_size: 0          # prompts per forward in gather_k   (0 = all at once)
k_early_exit: true       # stop the forward once the edited layer is observed
optimize_v_log_memory: false
second_moment_cache: true      # memoise the inverse covariance per handler
second_moment_device: "auto"   # "auto" keeps it on the layer device; "cpu" streams
insert_kv_in_place: false      # skip the old_W / update_matrix copies

# Prefix generation defaults.
prefix_mode: "self"
prefix_source: null
prefix_cache_path: null
prefix_cache_size: 256
