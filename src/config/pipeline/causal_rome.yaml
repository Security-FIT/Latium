defaults:
  - override /command@_global_.command: causal_trace
  - _self_

model: gpt2-large

causal_trace:
  num_valid_facts: ${command.causal_trace.num_valid_facts}

covariance:
  # null means: use the selected model value, then the second-moment
  # command fallback of 100000 samples. An explicit override wins.
  target_samples: null
  compute_if_missing: true

rome:
  n_tests: 30
  start_idx: 0
  overrides: []

output:
  root: null

resume:
  skip_causal_trace: false
  skip_second_moment: false
