run:
  models:
    - gpt2-large
  edit_methods:
    - rome
  n_tests: 30
  start_idx: 0
  case_index_file: null
  run_start_idx_step: 0
  runs_per_model: 1
  output_dir: ./analysis_out
  run_id: null
  progress_file: null
  progress_interval: 10
  worker_id: null
  fail_on_missing_second_moment: false
  force: false

tracking:
  provider: none
  project: latium
  entity: null
  mode: online
  run_name: null
  group: null
  tags: []
  heartbeat_seconds: 60

capture:
  profile: none
  enable: []
  disable: []

analysis:
  enabled: true
  continue_on_error: false
  preset: gram-localization
  enable: []
  disable: []
  methods: {}

render:
  enabled: false
  continue_on_error: false
  renderer_preset: gram-report
  style_preset: default
  enable: []
  disable: []
  renderers:
    gram-report:
      formats: [png, pdf, json]

output:
  json_out: null

analyze:
  run_root: null

validate_cov:
  fail_missing: false
