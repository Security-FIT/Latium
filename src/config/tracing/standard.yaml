mode: standard
num_noise_samples: 10
noise_multiplier: 3.0
seed: 42
require_correct_clean_prediction: true
ranking_metric: normalized_recovery
top_k_layers: 3
component: residual
window_size: 1
output_dir: analysis_out/causal_trace

signal_quality:
  min_total_effect: 0.05
  min_peak_normalized_recovery: 0.10
  max_peak_relative_std: 1.0
